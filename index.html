<!--
  MEDIKAMENTE APP - Persönliche Medikamentenverwaltung
  Version: 2.5  |  Datum: 23.05.2025
  GitHub: joachimwussow.github.io/medikamente

  FUNKTIONEN:
  - Foto-Scan: KI liest Name/Dosis/Inhaltsstoffe/Produkttyp automatisch
  - Produkttyp: verschreibungspflichtig, Medikament, Nahrungsergänzung, homöopathisch, Placebo
  - Wirkstoffe: löschbar per × Knopf, Validierung gegen Zahlen/Mengenangaben
  - Wirkstoff-Erklärungen: direkt in der Karte, on-demand geladen
  - Wechselwirkungen: KI-Analyse aller Medikamente
  - Bestand Keller + Bestand Küche: separate Felder
  - Cloud-Sync: Dropbox /Apps/Medikamente/daten.json (primär)
  - Export: alle Felder einzeln auswählbar
  - Migration: automatisch vom alten Dropbox-Pfad

  EINSTELLUNGEN:
  - Anthropic API Key: console.anthropic.com → API Keys
  - Dropbox Token: dropbox.com/developers/apps → Access Token
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Medikamente">
<title>Medikamente</title>
<style>
:root{--blue:#1a73e8;--blue-light:#e8f0fe;--green:#1e8c45;--green-light:#e6f4ea;--amber:#b45309;--amber-light:#fef3c7;--red:#c0392b;--red-light:#fdecea;--purple:#7b2d8b;--purple-light:#f3e8f7;--gray-50:#f8f9fa;--gray-100:#f1f3f4;--gray-200:#e8eaed;--gray-400:#bdc1c6;--gray-600:#80868b;--gray-800:#3c4043;--gray-900:#202124;--white:#fff;--radius:14px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--gray-100);color:var(--gray-900)}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sidebar{width:270px;min-width:270px;background:var(--white);border-right:1px solid var(--gray-200);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--gray-200)}
.app-title{font-size:21px;font-weight:700;color:var(--blue)}
.app-subtitle{font-size:12px;color:var(--gray-600);margin-top:3px}
.sync-status{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:5px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-400);flex-shrink:0}
.sync-dot.ok{background:var(--green)}.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.nav-list{flex:1;overflow-y:auto;padding:8px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;color:var(--gray-800);margin-bottom:2px;transition:background .15s;user-select:none}
.nav-item:hover{background:var(--gray-100)}.nav-item.active{background:var(--blue-light);color:var(--blue)}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:2px 7px}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--gray-200)}
.footer-btn{width:100%;padding:10px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--gray-800);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.footer-btn:hover{background:var(--gray-200)}
#topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;min-height:62px;flex-shrink:0}
.topbar-title{font-size:19px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1557b0}.btn-primary:disabled{background:var(--gray-400);cursor:not-allowed}
.btn-secondary{background:var(--gray-100);color:var(--gray-800);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-200)}
.btn-warning{background:var(--amber-light);color:var(--amber);border:1px solid #fbbf24}.btn-warning:hover{background:#fde68a}
#content{flex:1;overflow-y:auto;padding:22px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-header{padding:16px 20px 13px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:16px;font-weight:600}.card-body{padding:18px 20px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.stat-label{font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat-value{font-size:26px;font-weight:700}.stat-sub{font-size:11px;color:var(--gray-600);margin-top:2px}
.med-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
.med-item-header{padding:15px 18px;display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer}
.med-name{font-size:16px;font-weight:600;margin-bottom:5px}
.med-meta{display:flex;flex-wrap:wrap;gap:6px}
.meta-pill{display:inline-flex;align-items:center;gap:3px;background:var(--gray-100);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--gray-800)}
.meta-pill.timing{background:var(--blue-light);color:var(--blue)}
.meta-pill.stock{background:var(--green-light);color:var(--green)}
.meta-pill.type-rx{background:var(--red-light);color:var(--red)}
.meta-pill.type-med{background:var(--blue-light);color:var(--blue)}
.meta-pill.type-sup{background:var(--green-light);color:var(--green)}
.meta-pill.type-hom{background:var(--purple-light);color:var(--purple)}
.meta-pill.type-pla{background:var(--gray-100);color:var(--gray-600)}
.purpose-badge{display:inline-block;background:var(--green-light);color:var(--green);border-radius:20px;padding:3px 10px;font-size:12px}
.med-actions{display:flex;gap:7px;margin-left:14px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border:none;background:var(--gray-100);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:var(--gray-200)}.icon-btn svg{width:15px;height:15px;color:var(--gray-600)}
.icon-btn.danger:hover{background:var(--red-light)}.icon-btn.danger:hover svg{color:var(--red)}
.med-body{padding:0 18px 16px;border-top:1px solid var(--gray-100);display:none}.med-body.open{display:block}
.med-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.med-photo{border-radius:var(--radius-sm);overflow:hidden;cursor:pointer}
.med-photo img{width:100%;height:110px;object-fit:cover;display:block}
.med-photo-label{font-size:11px;color:var(--gray-600);text-align:center;padding:3px 0;background:var(--gray-50)}
.photo-fullscreen{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:3000;cursor:pointer}
.photo-fullscreen.open{display:flex}
.photo-fullscreen img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px}
.ing-section{margin-top:14px}
.ing-label{font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.ing-list{display:flex;flex-direction:column;gap:8px}
.ing-row{background:var(--gray-50);border-radius:var(--radius-sm);padding:10px 12px;border-left:3px solid var(--gray-200)}
.ing-row.has-expl{border-left-color:var(--blue)}
.ing-tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue);border-radius:20px;padding:3px 10px;font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:background .15s;font-weight:500}
.ing-tag:hover{background:#d2e3fc}
.ing-expl{font-size:12px;color:var(--gray-800);line-height:1.55;margin-top:4px}
.ing-expl.loading{color:var(--gray-400);font-style:italic}
/* Edit ingredient tags */
.ing-edit-tag{display:inline-flex;align-items:center;gap:3px;background:var(--blue-light);color:var(--blue);border-radius:20px;padding:3px 8px 3px 11px;font-size:13px;margin:3px}
.ing-del-btn{background:none;border:none;cursor:pointer;color:var(--blue);font-size:16px;line-height:1;padding:0 2px;opacity:.7}
.ing-del-btn:hover{opacity:1;color:var(--red)}
/* Ingredient overview */
.ing-overview-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ing-overview-header{padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.ing-overview-name{font-size:15px;font-weight:600;color:var(--blue)}
.ing-overview-products{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ing-product-badge{background:var(--green-light);color:var(--green);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500}
.ing-overview-body{padding:0 18px 14px;border-top:1px solid var(--gray-100);display:none}
.ing-overview-body.open{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:15px}
.field{display:flex;flex-direction:column;gap:5px}.field-label{font-size:12px;font-weight:500;color:var(--gray-600)}
input,select,textarea{font-size:15px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--white);color:var(--gray-900);font-family:inherit;transition:border-color .15s;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:75px;line-height:1.5}
.scan-zone{border:2px dashed var(--gray-400);border-radius:var(--radius);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative;background:var(--gray-50);transition:all .2s;text-align:center;padding:16px;cursor:pointer}
.scan-zone:hover{border-color:var(--blue);background:var(--blue-light)}
.scan-zone.has-photo{border-style:solid;border-color:var(--blue);padding:0;overflow:hidden}
.scan-zone input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.photo-ok{position:absolute;bottom:0;left:0;right:0;background:rgba(26,115,232,.85);color:#fff;font-size:12px;padding:4px;text-align:center}
.interaction-card{border-radius:var(--radius);padding:15px 18px;margin-bottom:12px;border:1px solid}
.interaction-card.safe{background:var(--green-light);border-color:#a8d5b5}
.interaction-card.warning{background:var(--amber-light);border-color:#fbbf24}
.interaction-card.danger{background:var(--red-light);border-color:#f5c6c2}
.int-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.int-title.safe{color:var(--green)}.int-title.warning{color:var(--amber)}.int-title.danger{color:var(--red)}
.int-item{font-size:13px;color:var(--gray-900);padding:6px 0;border-top:1px solid rgba(0,0,0,.07);line-height:1.55}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:600}.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-600);line-height:1;padding:4px}
.export-option{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:14px;cursor:pointer}
.export-option input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}
.empty{text-align:center;padding:60px 20px;color:var(--gray-600)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:16px;font-weight:500;color:var(--gray-800);margin-bottom:6px}.empty-sub{font-size:13px}
.spinner{width:17px;height:17px;border:2px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;right:22px;background:var(--gray-900);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;box-shadow:var(--shadow-md);z-index:2000;transform:translateY(70px);opacity:0;transition:all .3s;pointer-events:none;max-width:340px;line-height:1.4}
.toast.show{transform:translateY(0);opacity:1}
.setup-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:32px;max-width:500px;margin:40px auto}
.setup-title{font-size:20px;font-weight:700;margin-bottom:8px}
.setup-sub{font-size:14px;color:var(--gray-600);margin-bottom:20px;line-height:1.6}
.sec-divider{font-size:13px;font-weight:600;color:var(--gray-800);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-200);margin-top:20px}
.sec-divider:first-of-type{margin-top:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--gray-400);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="app-title">&#x1F48A; Medikamente</div>
      <div class="app-subtitle">Pers&#xF6;nliche Medikamentenverwaltung</div>
      <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-text">Nicht verbunden</span></div>
    </div>
    <nav class="nav-list">
      <div class="nav-item active" id="nav-list" onclick="showView('list')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Medikamentenliste <span class="nav-badge" id="med-count">0</span>
      </div>
      <div class="nav-item" id="nav-add" onclick="showView('add')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Medikament hinzuf&#xFC;gen
      </div>
      <div class="nav-item" id="nav-interactions" onclick="showView('interactions')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Wechselwirkungen
      </div>
      <div class="nav-item" id="nav-ingredients" onclick="showView('ingredients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Wirkstoffe &amp; Wirkung
      </div>
      <div class="nav-item" id="nav-settings" onclick="showView('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        &#x2699;&#xFE0F; Einstellungen &amp; API-Key
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="footer-btn" onclick="openModal('exportModal')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Daten exportieren
      </button>
    </div>
  </div>
  <div id="main">
    <div id="topbar"><div class="topbar-title" id="topbar-title">Medikamentenliste</div><div id="topbar-actions"></div></div>
    <div id="content"></div>
  </div>
</div>

<div id="photoViewer" class="photo-fullscreen" onclick="closePhotoViewer()"><img id="photoViewerImg" src="" alt=""></div>
<div id="ingModal" class="modal-overlay"><div class="modal"><div class="modal-header"><div class="modal-title" id="ingModalName"></div><button class="modal-close" onclick="closeModal('ingModal')">&#x2715;</button></div><div class="modal-body" id="ingModalBody"></div></div></div>

<div id="editModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Medikament bearbeiten</div><button class="modal-close" onclick="closeModal('editModal')">&#x2715;</button></div>
    <div class="modal-body" id="editBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('editModal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveEdit()">Speichern</button>
    </div>
  </div>
</div>

<div id="exportModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Daten exportieren</div><button class="modal-close" onclick="closeModal('exportModal')">&#x2715;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--gray-600);margin-bottom:14px;">Felder f&#xFC;r den Export ausw&#xE4;hlen:</p>
      <label class="export-option"><input type="checkbox" id="exp-name" checked> Medikamentenname</label>
      <label class="export-option"><input type="checkbox" id="exp-type" checked> Produkttyp</label>
      <label class="export-option"><input type="checkbox" id="exp-dose" checked> Dosis</label>
      <label class="export-option"><input type="checkbox" id="exp-timing" checked> Einnahmezeit</label>
      <label class="export-option"><input type="checkbox" id="exp-doctor"> Arzt</label>
      <label class="export-option"><input type="checkbox" id="exp-purpose" checked> Zweck / Indikation</label>
      <label class="export-option"><input type="checkbox" id="exp-ingredients" checked> Inhaltsstoffe &amp; Wirkung</label>
      <label class="export-option"><input type="checkbox" id="exp-stock" checked> Bestand Keller</label>
      <label class="export-option"><input type="checkbox" id="exp-stock2" checked> Bestand K&#xFC;che</label>
      <label class="export-option"><input type="checkbox" id="exp-notes"> Notizen</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('exportModal')">Abbrechen</button>
      <button class="btn btn-primary" onclick="doExportCSV()">Als CSV</button>
      <button class="btn btn-primary" onclick="doExportPDF()">Als PDF drucken</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SK='med_db_v4', SK2='med_settings_v3';

// ── DROPBOX ───────────────────────────────────────────────
function dbxUpload(content){
  var arg=JSON.stringify({path:DBX_PATH,mode:{'.tag':'overwrite'},autorename:false,mute:true});
  return fetch('https://content.dropboxapi.com/2/files/upload',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+cfg.dropboxToken,
      'Dropbox-API-Arg':arg,
      'Content-Type':'application/octet-stream'
    },
    body:typeof content==='string'?content:JSON.stringify(content)
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){
      console.error('Dropbox upload error:',t);
      throw new Error('Dropbox Upload: '+t.slice(0,120));
    });
    return r.json();
  });
}

function dbxDownload(path){
  var arg=JSON.stringify({path:path||DBX_PATH});
  return fetch('https://content.dropboxapi.com/2/files/download',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+cfg.dropboxToken,
      'Dropbox-API-Arg':arg
    }
  }).then(function(r){
    if(r.status===409)return null; // file not found
    if(!r.ok)return r.text().then(function(t){
      console.error('Dropbox download error:',t);
      throw new Error('Dropbox Download: '+t.slice(0,120));
    });
    return r.json();
  });
}

function migrateFromOldPath(cb){
  dbxDownload(DBX_PATH).then(function(newData){
    if(newData&&newData.medicines&&newData.medicines.length>0){if(cb)cb(false);return;}
    setSyncStatus('syncing','Pr\xFCfe alte Daten...');
    dbxDownload(DBX_PATH_OLD).then(function(oldData){
      if(oldData&&oldData.medicines&&oldData.medicines.length>0){
        db=oldData;localStorage.setItem(SK,JSON.stringify(db));updateBadge();
        setSyncStatus('syncing','\xDCbertrage '+oldData.medicines.length+' Eintr\xE4ge...');
        dbxUpload(JSON.stringify(db,null,2)).then(function(){
          setSyncStatus('ok','Daten \xFCbertragen \u2713');
          showToast('\u2705 '+oldData.medicines.length+' Medikamente \xFCbertragen!',4000);
          if(cb)cb(true);
        }).catch(function(){setSyncStatus('err','Fehler');if(cb)cb(false);});
      }else{setSyncStatus('ok','Bereit');if(cb)cb(false);}
    }).catch(function(){setSyncStatus('ok','Bereit');if(cb)cb(false);});
  }).catch(function(){if(cb)cb(false);});
}

function syncToCloud(){
  if(!cfg.dropboxToken)return;
  setSyncStatus('syncing','Speichern...');
  dbxUpload(JSON.stringify(db,null,2))
  .then(function(){setSyncStatus('ok','Dropbox ✓');})
  .catch(function(e){
    setSyncStatus('err','Fehler');
    showToast('⚠️ Dropbox: '+e.message.slice(0,80),5000);
  });
}

function loadFromCloud(cb){
  if(cfg.dropboxToken){
    setSyncStatus('syncing','Verbinde...');
    migrateFromOldPath(function(migrated){
      if(migrated){if(cb)cb(true);return;}
      dbxDownload().then(function(data){
        if(data&&data.medicines){db=data;localStorage.setItem(SK,JSON.stringify(db));updateBadge();setSyncStatus('ok','Dropbox \u2713');if(cb)cb(true);}
        else{setSyncStatus('ok','Dropbox bereit');if(cb)cb(false);}
      }).catch(function(e){setSyncStatus('err',e.message.slice(0,30));if(cb)cb(false);});
    });
  }else{setSyncStatus('','Kein Cloud-Speicher');if(cb)cb(false);}
}

function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncToCloud,2000);}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isRealIngredient(s){return s.length>1&&!/^[\d.,;%()[\]+\-\s\/mg]+$/i.test(s)&&!/^\d/.test(s);}

function callClaude(payload){
  if(!cfg.anthropicKey)return Promise.reject(new Error('Kein API-Key \u2192 \u2699\uFE0F Einstellungen'));
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':cfg.anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(payload)
  }).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t.slice(0,200));});return r.json();});
}

// ── BULK TOOLS ────────────────────────────────────────────
function cleanAllIngredients(){
  var status=document.getElementById('tool-status');
  var removed=0;
  db.medicines.forEach(function(m){
    var before=(m.ingredients||[]).length;
    m.ingredients=(m.ingredients||[]).filter(isRealIngredient);
    removed+=before-m.ingredients.length;
    // clean explanations
    var newExpl={};
    m.ingredients.forEach(function(ing){if(m.ingExplanations&&m.ingExplanations[ing])newExpl[ing]=m.ingExplanations[ing];});
    m.ingExplanations=newExpl;
  });
  saveDB();
  status.style.color='var(--green)';
  status.textContent='\u2705 '+removed+' ung\xFCltige Wirkstoffe entfernt.';
  showToast('\uD83E\uDDF9 '+removed+' ung\xFCltige Wirkstoffe entfernt');
}

function backfillProductTypes(){
  var status=document.getElementById('tool-status');
  var toProcess=db.medicines.filter(function(m){return !m.productType;});
  if(!toProcess.length){status.style.color='var(--green)';status.textContent='\u2705 Alle Eintr\xE4ge haben bereits einen Produkttyp.';return;}
  status.style.color='var(--gray-600)';
  status.textContent='KI analysiert '+toProcess.length+' Eintr\xE4ge...';
  var done=0;
  function next(){
    if(done>=toProcess.length){
      saveDB();
      status.style.color='var(--green)';
      status.textContent='\u2705 '+done+' Eintr\xE4ge aktualisiert.';
      showToast('\u2705 Produkttyp bei '+done+' Eintr\xE4gen nachgetragen',4000);
      return;
    }
    var m=toProcess[done];
    detectProductType(m.name,m.ingredients||[],function(type){
      m.productType=type;
      done++;
      status.textContent='KI analysiert... ('+done+'/'+toProcess.length+')';
      setTimeout(next,300);
    });
  }
  next();
}

function detectProductType(name,ingredients,cb){
  callClaude({model:'claude-sonnet-4-6',max_tokens:50,messages:[{role:'user',content:
    'Klassifiziere dieses Produkt: Name="'+name+'", Wirkstoffe="'+ingredients.join(', ')+'".\n'
    +'Antworte NUR mit einem dieser Werte (exakt): rx | med | sup | hom | pla\n'
    +'rx=verschreibungspflichtig, med=Medikament, sup=Nahrungsergänzung, hom=homöopathisch, pla=Placebo'}]})
  .then(function(data){
    var t=data.content.map(function(b){return b.text||'';}).join('').trim().toLowerCase();
    var valid=['rx','med','sup','hom','pla'];
    var found=valid.find(function(v){return t.includes(v);});
    cb(found||'med');
  }).catch(function(){cb('med');});
}

function buildMedCard(m){
  var expl=m.ingExplanations||{};
  var hasExpl=Object.keys(expl).length>0;
  var pt=prodTypeInfo(m.productType);
  var ingHtml='';
  if((m.ingredients||[]).length){
    ingHtml='<div class="ing-section"><div class="ing-label">Wirkstoffe &amp; Wirkung im K\xF6rper</div><div class="ing-list">';
    m.ingredients.forEach(function(ing){
      var explanation='';
      Object.keys(expl).forEach(function(k){if(k.toLowerCase()===ing.toLowerCase())explanation=expl[k];});
      ingHtml+='<div class="ing-row'+(explanation?' has-expl':'')+'">'
        +'<button class="ing-tag" data-ing="'+esc(ing)+'">&#x1F52C; '+esc(ing)+'</button>'
        +(explanation?'<div class="ing-expl">'+esc(explanation)+'</div>':'')
        +'</div>';
    });
    ingHtml+='</div>';
    if(!hasExpl&&cfg.anthropicKey)ingHtml+='<button class="btn btn-secondary" style="font-size:12px;padding:5px 12px;margin-top:8px;" data-explain="'+m.id+'">\uD83D\uDCA1 Wirkungen erkl\xE4ren</button>';
    ingHtml+='</div>';
  }
  var photoHtml='';
  if(m.photoFront||m.photoIng){
    photoHtml='<div class="med-photos">';
    if(m.photoFront)photoHtml+='<div class="med-photo" data-photo="'+esc(m.photoFront)+'"><img src="'+m.photoFront+'" alt=""><div class="med-photo-label">Vorderseite</div></div>';
    if(m.photoIng)photoHtml+='<div class="med-photo" data-photo="'+esc(m.photoIng)+'"><img src="'+m.photoIng+'" alt=""><div class="med-photo-label">Inhaltsstoffe</div></div>';
    photoHtml+='</div>';
  }
  return '<div class="med-item">'
    +'<div class="med-item-header" data-id="'+m.id+'">'
    +'<div style="flex:1"><div class="med-name">'+esc(m.name)+'</div>'
    +'<div class="med-meta">'
    +(pt?'<span class="meta-pill '+pt.cls+'">'+pt.icon+' '+esc(pt.label)+'</span>':'')
    +(m.dose?'<span class="meta-pill">\uD83D\uDC8A '+esc(m.dose)+'</span>':'')
    +(m.timing?'<span class="meta-pill timing">&#x23F0; '+esc(m.timing)+'</span>':'')
    +(m.purpose?'<span class="purpose-badge">&#x1F3AF; '+esc(m.purpose)+'</span>':'')
    +(m.doctor?'<span class="meta-pill">\uD83D\uDC68\u200D\u2695\uFE0F Dr. '+esc(m.doctor)+'</span>':'')
    +(m.stock!=null?'<span class="meta-pill stock">\uD83D\uDCE6 Keller: '+m.stock+'</span>':'')
    +(m.stock2!=null?'<span class="meta-pill stock">\uD83D\uDCE6 K\xFCche: '+m.stock2+'</span>':'')

function compressImage(dataUrl,maxPx,quality,cb){
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w>maxPx||h>maxPx){var r=maxPx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',quality));
  };
  img.src=dataUrl;
}

function handlePhoto(type,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    compressImage(e.target.result,1200,0.85,function(compressed){
      if(type==='front')photoFront=compressed;else photoIng=compressed;
      var kb=Math.round(compressed.length*0.75/1024);
      var zone=document.getElementById(type==='front'?'zone-front':'zone-ing');
      var inner=document.getElementById(type==='front'?'zi-front':'zi-ing');
      if(zone)zone.classList.add('has-photo');
      if(inner)inner.innerHTML='<img src="'+compressed+'" style="width:100%;height:130px;object-fit:cover;display:block;">'
        +'<div class="photo-ok">\u2713 '+(type==='front'?'Vorderseite':'Inhaltsstoffe')+' \u2014 '+kb+' KB</div>';
      var btn=document.getElementById('scan-btn');if(btn)btn.disabled=!(photoFront||photoIng);
    });
  };
  reader.readAsDataURL(file);
}

function runScan(){
  var btn=document.getElementById('scan-btn'),status=document.getElementById('scan-status');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> KI liest...';
  status.style.color='var(--gray-600)';status.textContent='Wird gesendet...';
  var content=[];
  if(photoFront){content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:photoFront.split(',')[1]}});content.push({type:'text',text:'Vorderseite der Verpackung.'});}
  if(photoIng){content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:photoIng.split(',')[1]}});content.push({type:'text',text:'Inhaltsstoff-Etikett.'});}
  content.push({type:'text',text:
    'Extrahiere aus diesen Medikamentenfotos auf Deutsch:\n'
    +'- name: vollst\xE4ndiger Produktname\n'
    +'- dose: Dosierung (z.B. "100mg")\n'
    +'- productType: eines von: rx | med | sup | hom | pla\n'
    +'  (rx=verschreibungspflichtig, med=Medikament, sup=Nahrungserg\xE4nzung, hom=hom\xF6opathisch, pla=Placebo)\n'
    +'- ingredients: nur echte Wirkstoffnamen, keine Zahlen oder Mengenangaben\n'
    +'Nur JSON: {"name":"","dose":"","productType":"","ingredients":[]}'});
  callClaude({model:'claude-sonnet-4-6',max_tokens:700,messages:[{role:'user',content:content}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
    var r=JSON.parse(text);
    if(r.name)document.getElementById('f-name').value=r.name;
    if(r.dose)document.getElementById('f-dose').value=r.dose;
    if(r.productType){var sel=document.getElementById('f-type');if(sel)sel.value=r.productType;}
    if(r.ingredients&&r.ingredients.length){
      var filtered=r.ingredients.filter(isRealIngredient);
      document.getElementById('f-ingredients').value=filtered.join(', ');
    }
    status.style.color='var(--green)';status.textContent='\u2705 Ausgelesen \u2014 bitte pr\xFCfen';
  })
  .catch(function(err){status.style.color='var(--red)';status.textContent='\u26A0\uFE0F '+err.message;})
  .finally(function(){btn.disabled=false;btn.innerHTML='\uD83D\uDD0D Erneut scannen';});
}

function saveNew(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('Bitte Medikamentenname eingeben.');document.getElementById('f-name').focus();return;}
  var normName=name.toLowerCase().replace(/\s+/g,' ').trim();
  var duplicate=db.medicines.find(function(m){return m.name.toLowerCase().replace(/\s+/g,' ').trim()===normName;});
  if(duplicate&&!confirm('"'+name+'" ist bereits vorhanden.\nTrotzdem hinzuf\xFCgen?'))return;
  var ingRaw=document.getElementById('f-ingredients').value.trim();
  var ings=ingRaw?ingRaw.split(',').map(function(s){return s.trim();}).filter(isRealIngredient):[];
  var stockEl=document.getElementById('f-stock');
  var stockEl2=document.getElementById('f-stock2');
  var typeEl=document.getElementById('f-type');
  var med={id:uid(),name:name,
    productType:typeEl&&typeEl.value?typeEl.value:null,
    dose:document.getElementById('f-dose').value.trim(),
    timing:document.getElementById('f-timing').value,
    doctor:document.getElementById('f-doctor').value.trim(),
    purpose:document.getElementById('f-purpose').value.trim(),
    ingredients:ings,ingExplanations:{},
    stock:stockEl&&stockEl.value!==''?parseInt(stockEl.value)||null:null,
    stock2:stockEl2&&stockEl2.value!==''?parseInt(stockEl2.value)||null:null,
    notes:document.getElementById('f-notes').value.trim(),
    addedAt:new Date().toISOString(),photoFront:null,photoIng:null};
  // If no productType detected, run detection
  function finalize(){
    db.medicines.push(med);saveDB();
    showToast('\u2705 Gespeichert'+(ings.length?' \u2014 Wirkungen werden geladen...':''));
    showView('list');
    if(ings.length&&cfg.anthropicKey)fetchAllIngExplanations(med);
  }
  function withPhotos(done2){
    var pending=(photoFront?1:0)+(photoIng?1:0);
    if(!pending){done2();return;}
    var cnt=0;
    if(photoFront)compressImage(photoFront,800,0.75,function(t){med.photoFront=t;if(++cnt>=pending)done2();});
    if(photoIng)compressImage(photoIng,800,0.75,function(t){med.photoIng=t;if(++cnt>=pending)done2();});
  }
  if(!med.productType&&cfg.anthropicKey){
    detectProductType(med.name,med.ingredients,function(type){
      med.productType=type;
      withPhotos(finalize);
    });
  }else{withPhotos(finalize);}
}

function saveEdit(){
  var m=null;for(var i=0;i<db.medicines.length;i++){if(db.medicines[i].id===editingId){m=db.medicines[i];break;}}
  if(!m)return;
  var name=document.getElementById('e-name').value.trim();if(!name){alert('Name erforderlich');return;}
  var oldIngs=JSON.stringify(m.ingredients||[]);
  m.name=name;
  m.productType=document.getElementById('e-type').value||null;
  m.dose=document.getElementById('e-dose').value.trim();
  m.timing=document.getElementById('e-timing').value;
  m.doctor=document.getElementById('e-doctor').value.trim();
  m.purpose=document.getElementById('e-purpose').value.trim();
  // Merge textarea with current tags (tags are already saved in db.medicines[i].ingredients)
  var ingRaw=document.getElementById('e-ingredients').value.trim();
  if(ingRaw){m.ingredients=ingRaw.split(',').map(function(s){return s.trim();}).filter(isRealIngredient);}

function checkInteractions(){
  var btn=document.getElementById('check-btn');
  btn.innerHTML='<span class="spinner"></span> Analysiere...';btn.disabled=true;
  var list=db.medicines.map(function(m){return m.name+' ('+(m.dose||'\u2014')+'), Wirkstoffe: '+((m.ingredients||[]).join(', ')||'unbekannt');}).join('\n');
  callClaude({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:
    'Ein 91-j\xE4hriger Patient nimmt:\n'+list+'\n\nPr\xFCfe auf Wechselwirkungen. Antworte NUR mit JSON:\n'
    +'{"level":"safe","summary":"kurz","items":[{"title":"x","detail":"y max 80 Zeichen","severity":"low"}]}\n'
    +'Max 5 Items. level: safe/warning/danger.'}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
    var r;try{r=JSON.parse(text);}catch(e){var lm=text.match(/"level"\s*:\s*"(safe|warning|danger)"/);r={level:lm?lm[1]:'warning',summary:'Analyse unvollst\xE4ndig \u2014 bitte erneut versuchen.',items:[]};}
    var icons={safe:'\u2705',warning:'\u26A0\uFE0F',danger:'\uD83D\uDEA8'};
    var labels={safe:'Keine bedeutsamen Wechselwirkungen',warning:'M\xF6gliche Wechselwirkungen \u2014 mit Arzt besprechen',danger:'Wichtige Wechselwirkungen \u2014 Arzt sofort konsultieren!'};
    var sc={low:'var(--green)',medium:'var(--amber)',high:'var(--red)'};
    var html='<div class="interaction-card '+r.level+'"><div class="int-title '+r.level+'">'+icons[r.level]+' '+labels[r.level]+'</div>'+(r.summary?'<div style="font-size:13px;margin-bottom:6px;">'+esc(r.summary)+'</div>':'');
    (r.items||[]).forEach(function(it){html+='<div class="int-item"><strong style="color:'+(sc[it.severity]||'var(--gray-900)')+'">'+esc(it.title)+'</strong><br>'+esc(it.detail)+'</div>';});
    if(r.level!=='safe')html+='<div class="int-item" style="font-weight:600;color:var(--red);">\u2695\uFE0F Immer Arzt oder Apotheker konsultieren.</div>';
    html+='</div>';
    document.getElementById('int-results').innerHTML=html;
  })
  .catch(function(err){document.getElementById('int-results').innerHTML='<div class="interaction-card warning"><div class="int-title warning">\u26A0\uFE0F '+esc(err.message)+'</div></div>';})
  .finally(function(){btn.innerHTML='\uD83D\uDD0D Erneut pr\xFCfen';btn.disabled=false;});
}

      +'</div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'
      +'</div>'
      +'<div class="ing-overview-body" id="iob-'+esc(ing)+'">'
      +(knownExpl[ing]?'<div style="font-size:14px;color:var(--gray-800);line-height:1.65;margin-top:10px;">'+esc(knownExpl[ing])+'</div>':'<div style="font-size:13px;color:var(--gray-400);font-style:italic;margin-top:8px;">Antippen zum Laden...</div>')
      +'</div></div>';
  });
  html+='</div></div>';
  c.innerHTML=html;
  c._knownExpl=knownExpl;
}

function loadIngOverviewExpl(ing,bodyEl){
  bodyEl.dataset.loaded='1';
  var c=document.getElementById('content');
  var knownExpl=c._knownExpl||{};
  if(knownExpl[ing]){bodyEl.innerHTML='<div style="font-size:14px;color:var(--gray-800);line-height:1.65;margin-top:10px;">'+esc(knownExpl[ing])+'</div>';return;}
  bodyEl.innerHTML='<div style="margin-top:8px;"><span class="spinner"></span> Erkl\xE4rung wird geladen...</div>';
  callClaude({model:'claude-sonnet-4-6',max_tokens:500,messages:[{role:'user',content:'Erkl\xE4re den Wirkstoff "'+ing+'" auf Deutsch in 2-3 S\xE4tzen f\xFCr einen 91-j\xE4hrigen Patienten: Was macht er im K\xF6rper? Wozu? Wichtige Hinweise? Einfaches Deutsch.'}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('');
    bodyEl.innerHTML='<div style="font-size:14px;color:var(--gray-800);line-height:1.65;margin-top:10px;">'+esc(text)+'</div>';
    db.medicines.forEach(function(m){if((m.ingredients||[]).indexOf(ing)!==-1){if(!m.ingExplanations)m.ingExplanations={};m.ingExplanations[ing]=text;}});
    saveDB();
  })
  .catch(function(err){
    bodyEl.innerHTML='<div style="color:var(--red);font-size:13px;margin-top:8px;">\u26A0\uFE0F '+esc(err.message.slice(0,100))
      +'<br><button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;margin-top:6px;" onclick="this.parentNode.dataset.loaded=\'\';loadIngOverviewExpl(\''+esc(ing)+'\',this.parentNode)">'
      +'Erneut versuchen</button></div>';
  });
}

function lookupIng(name){
  document.getElementById('ingModalName').textContent='\uD83D\uDD2C '+name;
  document.getElementById('ingModalBody').innerHTML='<div style="text-align:center;padding:24px;"><span class="spinner"></span></div>';
  openModal('ingModal');
  var products=[];
  db.medicines.forEach(function(m){if((m.ingredients||[]).some(function(i){return i.toLowerCase()===name.toLowerCase();}))products.push(m.name);});
  callClaude({model:'claude-sonnet-4-6',max_tokens:600,messages:[{role:'user',content:'Erkl\xE4re den Wirkstoff "'+name+'" auf Deutsch in 3-4 S\xE4tzen f\xFCr einen 91-j\xE4hrigen Patienten: Was macht er im K\xF6rper? Wozu? Wichtige Hinweise?'}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('');
    var prodHtml=products.length?'<div style="margin-bottom:12px;font-size:13px;color:var(--gray-600);">Enthalten in: '+products.map(function(p){return '<span class="ing-product-badge" style="margin-right:4px;">'+esc(p)+'</span>';}).join('')+'</div>':'';
    document.getElementById('ingModalBody').innerHTML=prodHtml+'<p style="font-size:14px;line-height:1.7;color:var(--gray-800);">'+esc(text)+'</p>';
  })
  .catch(function(err){document.getElementById('ingModalBody').innerHTML='<p style="color:var(--red);">\u26A0\uFE0F '+esc(err.message.slice(0,120))+'</p>';});
}

// ── EXPORT ────────────────────────────────────────────────
function doExportCSV(){
  var f={
    name:document.getElementById('exp-name').checked,
    type:document.getElementById('exp-type').checked,
    dose:document.getElementById('exp-dose').checked,
    timing:document.getElementById('exp-timing').checked,
    doctor:document.getElementById('exp-doctor').checked,
    purpose:document.getElementById('exp-purpose').checked,
    ingredients:document.getElementById('exp-ingredients').checked,
    stock:document.getElementById('exp-stock').checked,
    stock2:document.getElementById('exp-stock2').checked,
    notes:document.getElementById('exp-notes').checked
  };
  var hdrs=[];
  if(f.name)hdrs.push('Name');if(f.type)hdrs.push('Produkttyp');if(f.dose)hdrs.push('Dosis');
  if(f.timing)hdrs.push('Einnahme');if(f.doctor)hdrs.push('Arzt');if(f.purpose)hdrs.push('Zweck');
  if(f.ingredients)hdrs.push('Inhaltsstoffe');if(f.stock)hdrs.push('Bestand Keller');
  if(f.stock2)hdrs.push('Bestand K\xFCche');if(f.notes)hdrs.push('Notizen');
  var rows=db.medicines.map(function(m){
    var pt=prodTypeInfo(m.productType);
    var r=[];
    if(f.name)r.push('"'+(m.name||'').replace(/"/g,'""')+'"');
    if(f.type)r.push('"'+(pt?pt.label:'').replace(/"/g,'""')+'"');
    if(f.dose)r.push('"'+(m.dose||'').replace(/"/g,'""')+'"');
    if(f.timing)r.push('"'+(m.timing||'').replace(/"/g,'""')+'"');
    if(f.doctor)r.push('"'+(m.doctor||'').replace(/"/g,'""')+'"');
    if(f.purpose)r.push('"'+(m.purpose||'').replace(/"/g,'""')+'"');
    if(f.ingredients)r.push('"'+(m.ingredients||[]).join('; ').replace(/"/g,'""')+'"');
    if(f.stock)r.push(m.stock!=null?m.stock:'');
    if(f.stock2)r.push(m.stock2!=null?m.stock2:'');
    if(f.notes)r.push('"'+(m.notes||'').replace(/"/g,'""')+'"');
    return r.join(',');
  });
  var csv='\uFEFF'+[hdrs.join(',')].concat(rows).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Medikamente_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  closeModal('exportModal');showToast('\u2705 CSV exportiert');
}

function doExportPDF(){
  var f={
    name:document.getElementById('exp-name').checked,
    type:document.getElementById('exp-type').checked,
    dose:document.getElementById('exp-dose').checked,
    timing:document.getElementById('exp-timing').checked,
    doctor:document.getElementById('exp-doctor').checked,
    purpose:document.getElementById('exp-purpose').checked,
    ingredients:document.getElementById('exp-ingredients').checked,
    stock:document.getElementById('exp-stock').checked,
    stock2:document.getElementById('exp-stock2').checked,
    notes:document.getElementById('exp-notes').checked
  };
  var rows=db.medicines.map(function(m){
    var pt=prodTypeInfo(m.productType);
    var h='<div style="border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:14px;page-break-inside:avoid;">';
    if(f.name)h+='<h3 style="margin:0 0 4px;font-size:16px;">'+(m.name||'')+'</h3>';
    if(f.type&&pt)h+='<div style="font-size:12px;color:#666;margin-bottom:7px;">'+pt.icon+' '+pt.label+'</div>';
    var meta=[];
    if(f.dose&&m.dose)meta.push('<strong>Dosis:</strong> '+m.dose);
    if(f.timing&&m.timing)meta.push('<strong>Einnahme:</strong> '+m.timing);
    if(f.doctor&&m.doctor)meta.push('<strong>Arzt:</strong> Dr. '+m.doctor);
    if(f.purpose&&m.purpose)meta.push('<strong>Zweck:</strong> '+m.purpose);
    if(f.stock&&m.stock!=null)meta.push('<strong>Bestand Keller:</strong> '+m.stock);
    if(f.stock2&&m.stock2!=null)meta.push('<strong>Bestand K\xFCche:</strong> '+m.stock2);
    if(meta.length)h+='<p style="font-size:13px;color:#444;margin:0 0 7px;">'+meta.join(' &nbsp;|&nbsp; ')+'</p>';
    if(f.ingredients&&m.ingredients&&m.ingredients.length){
      var expl=m.ingExplanations||{};
      h+='<p style="font-size:13px;font-weight:600;margin:0 0 4px;">Inhaltsstoffe:</p><ul style="font-size:12px;color:#333;margin:0 0 6px 18px;">';
      m.ingredients.forEach(function(ing){var e=expl[ing]||'';h+='<li><strong>'+ing+'</strong>'+(e?': '+e:'')+'</li>';});
      h+='</ul>';
    }
    if(f.notes&&m.notes)h+='<p style="font-size:13px;color:#555;margin:0;"><strong>Notizen:</strong> '+m.notes+'</p>';
    if(m.photoFront||m.photoIng){
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">';
      if(m.photoFront)h+='<div><img src="'+m.photoFront+'" style="width:100%;border-radius:6px;"><p style="font-size:11px;color:#888;text-align:center;">Vorderseite</p></div>';
      if(m.photoIng)h+='<div><img src="'+m.photoIng+'" style="width:100%;border-radius:6px;"><p style="font-size:11px;color:#888;text-align:center;">Inhaltsstoffe</p></div>';
      h+='</div>';
    }
    h+='</div>';return h;
  }).join('');
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Medikamentenliste</title>'
    +'<style>body{font-family:-apple-system,sans-serif;max-width:700px;margin:30px auto;color:#222;}@media print{body{margin:10px;}}</style>'
    +'</head><body><h1 style="font-size:21px;">\uD83D\uDC8A Medikamentenliste</h1>'
    +'<p style="color:#666;font-size:13px;margin-bottom:22px;">Erstellt: '+new Date().toLocaleDateString('de-DE')+' | '+db.medicines.length+' Eintr\xE4ge</p>'
    +rows+'</body></html>');
  win.document.close();setTimeout(function(){win.print();},400);
  closeModal('exportModal');
}
