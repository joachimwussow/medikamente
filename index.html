<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Medikamente">
<title>Medikamente</title>
<style>
:root{--blue:#1a73e8;--blue-light:#e8f0fe;--green:#1e8c45;--green-light:#e6f4ea;--amber:#b45309;--amber-light:#fef3c7;--red:#c0392b;--red-light:#fdecea;--gray-50:#f8f9fa;--gray-100:#f1f3f4;--gray-200:#e8eaed;--gray-400:#bdc1c6;--gray-600:#80868b;--gray-800:#3c4043;--gray-900:#202124;--white:#ffffff;--radius:14px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,0.12),0 1px 2px rgba(0,0,0,0.08);--shadow-md:0 4px 12px rgba(0,0,0,0.15);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--gray-100);color:var(--gray-900);}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden;}
#sidebar{width:270px;min-width:270px;background:var(--white);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:20px 20px 14px;border-bottom:1px solid var(--gray-200);}
.app-title{font-size:21px;font-weight:700;color:var(--blue);}
.app-subtitle{font-size:12px;color:var(--gray-600);margin-top:3px;}
.sync-status{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:5px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-400);flex-shrink:0;}
.sync-dot.ok{background:var(--green);}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.nav-list{flex:1;overflow-y:auto;padding:8px 10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;color:var(--gray-800);margin-bottom:2px;transition:background 0.15s;user-select:none;}
.nav-item:hover{background:var(--gray-100);}
.nav-item.active{background:var(--blue-light);color:var(--blue);}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:2px 7px;}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--gray-200);}
.footer-btn{width:100%;padding:10px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--gray-800);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
.footer-btn:hover{background:var(--gray-200);}
#topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;min-height:62px;flex-shrink:0;}
.topbar-title{font-size:19px;font-weight:600;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;white-space:nowrap;font-family:inherit;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#1557b0;}
.btn-primary:disabled{background:var(--gray-400);cursor:not-allowed;}
.btn-secondary{background:var(--gray-100);color:var(--gray-800);border:1px solid var(--gray-200);}
.btn-secondary:hover{background:var(--gray-200);}
#content{flex:1;overflow-y:auto;padding:22px;}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.card-header{padding:16px 20px 13px;border-bottom:1px solid var(--gray-200);}
.card-title{font-size:16px;font-weight:600;}
.card-body{padding:18px 20px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.stat-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;}
.stat-label{font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.stat-value{font-size:26px;font-weight:700;color:var(--gray-900);}
.stat-sub{font-size:11px;color:var(--gray-600);margin-top:2px;}
.med-item{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;}
.med-item-header{padding:15px 18px;display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer;}
.med-name{font-size:16px;font-weight:600;margin-bottom:5px;}
.med-meta{display:flex;flex-wrap:wrap;gap:6px;}
.meta-pill{display:inline-flex;align-items:center;gap:3px;background:var(--gray-100);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--gray-800);}
.meta-pill.timing{background:var(--blue-light);color:var(--blue);}
.purpose-badge{display:inline-block;background:var(--green-light);color:var(--green);border-radius:20px;padding:3px 10px;font-size:12px;}
.med-actions{display:flex;gap:7px;margin-left:14px;flex-shrink:0;}
.icon-btn{width:32px;height:32px;border:none;background:var(--gray-100);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gray-200);}
.icon-btn svg{width:15px;height:15px;color:var(--gray-600);}
.icon-btn.danger:hover{background:var(--red-light);}
.icon-btn.danger:hover svg{color:var(--red);}
.med-body{padding:0 18px 15px;border-top:1px solid var(--gray-100);display:none;}
.med-body.open{display:block;}
.ing-section{margin-top:13px;}
.ing-label{font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:7px;}
.ing-tags{display:flex;flex-wrap:wrap;gap:6px;}
.ing-tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-light);color:var(--blue);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:background 0.15s;}
.ing-tag:hover{background:#d2e3fc;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:15px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field-label{font-size:12px;font-weight:500;color:var(--gray-600);}
input,select,textarea{font-size:15px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--white);color:var(--gray-900);font-family:inherit;transition:border-color 0.15s;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
textarea{resize:vertical;min-height:75px;line-height:1.5;}
.scan-zone{border:2px dashed var(--gray-400);border-radius:var(--radius);min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative;background:var(--gray-50);transition:all 0.2s;text-align:center;padding:16px;cursor:pointer;}
.scan-zone:hover{border-color:var(--blue);background:var(--blue-light);}
.scan-zone.has-photo{border-style:solid;border-color:var(--blue);padding:0;overflow:hidden;}
.scan-zone input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.scan-zone-icon{font-size:32px;}
.scan-zone-text{font-size:14px;font-weight:500;color:var(--gray-800);}
.scan-zone-sub{font-size:12px;color:var(--gray-600);}
.photo-ok{position:absolute;bottom:0;left:0;right:0;background:rgba(26,115,232,0.85);color:#fff;font-size:12px;padding:4px;text-align:center;}
.interaction-card{border-radius:var(--radius);padding:15px 18px;margin-bottom:12px;border:1px solid;}
.interaction-card.safe{background:var(--green-light);border-color:#a8d5b5;}
.interaction-card.warning{background:var(--amber-light);border-color:#fbbf24;}
.interaction-card.danger{background:var(--red-light);border-color:#f5c6c2;}
.int-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.int-title.safe{color:var(--green);}
.int-title.warning{color:var(--amber);}
.int-title.danger{color:var(--red);}
.int-item{font-size:13px;color:var(--gray-900);padding:6px 0;border-top:1px solid rgba(0,0,0,0.07);line-height:1.55;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:18px;font-weight:600;}
.modal-body{padding:22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-600);line-height:1;padding:4px;}
.export-option{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:14px;cursor:pointer;}
.export-option input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);}
.empty{text-align:center;padding:60px 20px;color:var(--gray-600);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:16px;font-weight:500;color:var(--gray-800);margin-bottom:6px;}
.empty-sub{font-size:13px;}
.spinner{width:17px;height:17px;border:2px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:22px;right:22px;background:var(--gray-900);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;box-shadow:var(--shadow-md);z-index:2000;transform:translateY(70px);opacity:0;transition:all 0.3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.ing-detail{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:20px 22px;margin-bottom:16px;border-left:4px solid var(--blue);display:none;}
.ing-detail.visible{display:block;}
.ing-detail-name{font-size:18px;font-weight:700;margin-bottom:8px;}
.ing-detail-body{font-size:14px;color:var(--gray-800);line-height:1.65;}
.setup-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:32px;max-width:500px;margin:40px auto;}
.setup-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.setup-sub{font-size:14px;color:var(--gray-600);margin-bottom:20px;line-height:1.6;}
.section-divider{font-size:13px;font-weight:600;color:var(--gray-800);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-200);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--gray-400);border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="app-title">💊 Medikamente</div>
      <div class="app-subtitle">Persönliche Medikamentenverwaltung</div>
      <div class="sync-status" id="sync-status">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-text">Nicht verbunden</span>
      </div>
    </div>
    <nav class="nav-list">
      <div class="nav-item active" id="nav-list" onclick="showView('list')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Medikamentenliste
        <span class="nav-badge" id="med-count">0</span>
      </div>
      <div class="nav-item" id="nav-add" onclick="showView('add')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Medikament hinzufügen
      </div>
      <div class="nav-item" id="nav-interactions" onclick="showView('interactions')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Wechselwirkungen
      </div>
      <div class="nav-item" id="nav-ingredients" onclick="showView('ingredients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Wirkstoffe &amp; Wirkung
      </div>
      <div class="nav-item" id="nav-settings" onclick="showView('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        &#x2699;&#xFE0F; Einstellungen &amp; API-Key
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="footer-btn" onclick="openExport()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Daten exportieren
      </button>
    </div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="topbar-title" id="topbar-title">Medikamentenliste</div>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="ingModal" style="display:none" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="ingModalName"></div>
      <button class="modal-close" onclick="document.getElementById('ingModal').style.display='none'">&#x2715;</button>
    </div>
    <div class="modal-body" id="ingModalBody"></div>
  </div>
</div>

<div id="editModal" style="display:none" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Medikament bearbeiten</div>
      <button class="modal-close" onclick="closeEdit()">&#x2715;</button>
    </div>
    <div class="modal-body" id="editBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEdit()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveEdit()">Speichern</button>
    </div>
  </div>
</div>

<div id="exportModal" style="display:none" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Daten exportieren</div>
      <button class="modal-close" onclick="document.getElementById('exportModal').style.display='none'">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--gray-600);margin-bottom:14px;">Felder auswählen:</p>
      <label class="export-option"><input type="checkbox" id="exp-name" checked> Medikamentenname</label>
      <label class="export-option"><input type="checkbox" id="exp-dose" checked> Dosis</label>
      <label class="export-option"><input type="checkbox" id="exp-timing" checked> Einnahmezeit</label>
      <label class="export-option"><input type="checkbox" id="exp-doctor"> Arzt</label>
      <label class="export-option"><input type="checkbox" id="exp-purpose" checked> Zweck / Indikation</label>
      <label class="export-option"><input type="checkbox" id="exp-ingredients" checked> Inhaltsstoffe</label>
      <label class="export-option"><input type="checkbox" id="exp-notes"> Notizen</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('exportModal').style.display='none'">Abbrechen</button>
      <button class="btn btn-primary" onclick="doExportCSV()">Als CSV</button>
      <button class="btn btn-primary" onclick="doExportPDF()">Als PDF drucken</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY='med_db_v3';
var SETTINGS_KEY='med_settings_v2';
var GIST_FILENAME='medikamente_daten.json';
var db={medicines:[]};
var settings={githubToken:'',gistId:'',anthropicKey:''};
var currentView='list';
var editingId=null;
var photoFront=null;
var photoIng=null;
var syncTimer=null;

function loadSettings(){try{var s=localStorage.getItem(SETTINGS_KEY);if(s)settings=JSON.parse(s);}catch(e){}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}
function setSyncStatus(state,text){var d=document.getElementById('sync-dot');var t=document.getElementById('sync-text');if(!d||!t)return;d.className='sync-dot '+state;t.textContent=text;}
function gistHeaders(){return{'Authorization':'token '+settings.githubToken,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};}

function syncToCloud(){
  if(!settings.githubToken)return;
  setSyncStatus('syncing','Speichern...');
  var files={};files[GIST_FILENAME]={content:JSON.stringify(db,null,2)};
  var body=JSON.stringify({description:'Medikamente App Daten',public:false,files:files});
  if(settings.gistId){
    fetch('https://api.github.com/gists/'+settings.gistId,{method:'PATCH',headers:gistHeaders(),body:body})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(){setSyncStatus('ok','Gespeichert ✓');})
    .catch(function(e){setSyncStatus('err','Sync-Fehler');});
  }else{
    fetch('https://api.github.com/gists',{method:'POST',headers:gistHeaders(),body:body})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){settings.gistId=data.id;saveSettings();setSyncStatus('ok','Gespeichert ✓');})
    .catch(function(e){setSyncStatus('err','Sync-Fehler');});
  }
}

function loadFromCloud(callback){
  if(!settings.githubToken||!settings.gistId){if(callback)callback(false);return;}
  setSyncStatus('syncing','Lade...');
  fetch('https://api.github.com/gists/'+settings.gistId,{headers:gistHeaders()})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var file=data.files&&data.files[GIST_FILENAME];
    if(file&&file.content){var p=JSON.parse(file.content);if(p&&p.medicines){db=p;localStorage.setItem(STORAGE_KEY,JSON.stringify(db));updateBadge();setSyncStatus('ok','Synchronisiert ✓');if(callback)callback(true);return;}}
    setSyncStatus('ok','Verbunden ✓');if(callback)callback(false);
  })
  .catch(function(){setSyncStatus('err','Ladefehler');if(callback)callback(false);});
}

function scheduleSyncToCloud(){clearTimeout(syncTimer);syncTimer=setTimeout(syncToCloud,1500);}
function loadDB(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)db=JSON.parse(r);}catch(e){db={medicines:[]};}}
function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));updateBadge();scheduleSyncToCloud();}
function updateBadge(){var el=document.getElementById('med-count');if(el)el.textContent=db.medicines.length;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2600);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function showView(view){
  currentView=view;
  ['list','add','interactions','ingredients','settings'].forEach(function(v){var el=document.getElementById('nav-'+v);if(el)el.classList.remove('active');});
  var a=document.getElementById('nav-'+view);if(a)a.classList.add('active');
  var titles={list:'Medikamentenliste',add:'Neues Medikament',interactions:'Wechselwirkungen prüfen',ingredients:'Wirkstoffe & Wirkung',settings:'Einstellungen & API-Key'};
  document.getElementById('topbar-title').textContent=titles[view]||'';
  document.getElementById('topbar-actions').innerHTML='';
  if(view==='list')renderList();
  else if(view==='add')renderAdd();

function compressImage(dataUrl,callback){
  var img=new Image();
  img.onload=function(){
    var mW=1200,mH=1200,w=img.width,h=img.height;
    if(w>mW||h>mH){var r=Math.min(mW/w,mH/h);w=Math.round(w*r);h=Math.round(h*r);}
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    callback(c.toDataURL('image/jpeg',0.82));
  };
  img.src=dataUrl;
}

function handlePhoto(type,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    compressImage(e.target.result,function(compressed){
      var kb=Math.round(compressed.length*0.75/1024);
      var zone=document.getElementById(type==='front'?'zone-front':'zone-ing');
      var inner=document.getElementById(type==='front'?'zi-front':'zi-ing');
      if(type==='front')photoFront=compressed;else photoIng=compressed;
      if(zone)zone.classList.add('has-photo');
      if(inner)inner.innerHTML='<img src="'+compressed+'" style="width:100%;height:130px;object-fit:cover;display:block;">'
        +'<div class="photo-ok">&#x2713; '+(type==='front'?'Vorderseite':'Inhaltsstoffe')+' &mdash; '+kb+' KB</div>';
      var btn=document.getElementById('scan-btn');if(btn)btn.disabled=!(photoFront||photoIng);
    });
  };
  reader.readAsDataURL(file);
}

function callClaude(payload){
  if(!settings.anthropicKey){return Promise.reject(new Error('Kein API-Key. Bitte unter ⚙️ Einstellungen eintragen.'));}
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':settings.anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(payload)
  }).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t.slice(0,200));});return r.json();});
}

function runScan(){
  var btn=document.getElementById('scan-btn');
  var status=document.getElementById('scan-status');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> KI liest Fotos aus...';
  status.style.color='var(--gray-600)';status.textContent='Wird gesendet...';
  var content=[];
  if(photoFront){content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:photoFront.split(',')[1]}});content.push({type:'text',text:'Dies ist die VORDERSEITE der Medikamentenverpackung.'});}
  if(photoIng){content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:photoIng.split(',')[1]}});content.push({type:'text',text:'Dies ist das INHALTSSTOFF-Etikett.'});}
  content.push({type:'text',text:'Extrahiere name, dose, ingredients[] auf Deutsch. Nur JSON ohne Markdown: {"name":"","dose":"","ingredients":[]}'});
  callClaude({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:content}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
    var r=JSON.parse(text);
    if(r.name)document.getElementById('f-name').value=r.name;
    if(r.dose)document.getElementById('f-dose').value=r.dose;
    if(r.ingredients&&r.ingredients.length)document.getElementById('f-ingredients').value=r.ingredients.join(', ');
    status.style.color='var(--green)';status.textContent='✅ Erfolgreich ausgelesen — bitte Felder prüfen';
  })
  .catch(function(err){status.style.color='var(--red)';status.textContent='⚠️ Fehler: '+err.message;})
  .finally(function(){btn.disabled=false;btn.innerHTML='&#x1F50D; Erneut scannen';});
}

function checkInteractions(){
  var btn=document.getElementById('check-btn');
  btn.innerHTML='<span class="spinner"></span> Analysiere...';btn.disabled=true;
  var list=db.medicines.map(function(m){return m.name+' ('+(m.dose||'—')+'), Wirkstoffe: '+((m.ingredients||[]).join(', ')||'unbekannt');}).join('\n');
  callClaude({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:'Ein 91-jähriger Patient nimmt:\n'+list+'\n\nAnalysiere Wechselwirkungen auf Deutsch. Nur JSON: {"level":"safe"|"warning"|"danger","summary":"Kurzzusammenfassung","items":[{"title":"Titel","detail":"Erklärung","severity":"low"|"medium"|"high"}]}'}]})
  .then(function(data){
    var text=data.content.map(function(b){return b.text||'';}).join('').replace(/```json|```/g,'').trim();
    var r=JSON.parse(text);
    var icons={safe:'✅',warning:'⚠️',danger:'🚨'};
    var labels={safe:'Keine bedeutsamen Wechselwirkungen',warning:'Mögliche Wechselwirkungen — mit Arzt besprechen',danger:'Wichtige Wechselwirkungen — Arzt sofort konsultieren!'};
    var sc={low:'var(--green)',medium:'var(--amber)',high:'var(--red)'};
    var html='<div class="interaction-card '+r.level+'"><div class="int-title '+r.level+'">'+icons[r.level]+' '+labels[r.level]+'</div>'+(r.summary?'<div style="font-size:13px;margin-bottom:6px;">'+esc(r.summary)+'</div>':'');
    (r.items||[]).forEach(function(it){html+='<div class="int-item"><strong style="color:'+(sc[it.severity]||'var(--gray-900)')+'">'+esc(it.title)+'</strong><br>'+esc(it.detail)+'</div>';});
    if(r.level!=='safe')html+='<div class="int-item" style="font-weight:600;color:var(--red);">&#x2695;&#xFE0F; Immer Arzt oder Apotheker konsultieren.</div>';
    html+='</div>';
    document.getElementById('int-results').innerHTML=html;
  })
  .catch(function(err){document.getElementById('int-results').innerHTML='<div class="interaction-card warning"><div class="int-title warning">&#x26A0;&#xFE0F; Fehler: '+esc(err.message)+'</div></div>';})
  .finally(function(){btn.innerHTML='&#x1F50D; Erneut prüfen';btn.disabled=false;});
}

function lookupIng(name){
  if(currentView==='list'){
    document.getElementById('ingModalName').textContent='🔬 '+name;
    document.getElementById('ingModalBody').innerHTML='<div style="text-align:center;padding:24px;"><span class="spinner"></span></div>';
    document.getElementById('ingModal').style.display='flex';
    fetchIngInfo(name,function(text){document.getElementById('ingModalBody').innerHTML='<p style="font-size:14px;line-height:1.7;color:var(--gray-800);">'+text+'</p>';},function(){document.getElementById('ingModalBody').innerHTML='<p style="color:var(--red);">Fehler beim Laden.</p>';});
    return;
  }
  if(currentView==='ingredients'){
    var panel=document.getElementById('ing-detail');
    if(!panel){renderIngredients();setTimeout(function(){lookupIng(name);},100);return;}
    panel.classList.add('visible');
    document.getElementById('ing-detail-name').textContent=name;
    document.getElementById('ing-detail-body').innerHTML='<span class="spinner"></span> Lade...';
    panel.scrollIntoView({behavior:'smooth',block:'start'});
    fetchIngInfo(name,function(text){document.getElementById('ing-detail-body').innerHTML='<p style="font-size:14px;line-height:1.7;">'+text+'</p>';},function(){document.getElementById('ing-detail-body').innerHTML='<p style="color:var(--red);">Fehler.</p>';});
  }
}

function fetchIngInfo(name,onOk,onErr){
  callClaude({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:'Erkläre den Wirkstoff "'+name+'" auf Deutsch in 3-4 Sätzen für einen Patienten: Was macht er im Körper? Wofür eingesetzt? Wichtige Hinweise? Einfaches Deutsch.'}]})
  .then(function(data){onOk(data.content.map(function(b){return b.text||'';}).join(''));})
  .catch(function(e){onErr(e.message);});
}

function doExportCSV(){
  var f={name:document.getElementById('exp-name').checked,dose:document.getElementById('exp-dose').checked,timing:document.getElementById('exp-timing').checked,doctor:document.getElementById('exp-doctor').checked,purpose:document.getElementById('exp-purpose').checked,ingredients:document.getElementById('exp-ingredients').checked,notes:document.getElementById('exp-notes').checked};
  var hdrs=[];if(f.name)hdrs.push('Name');if(f.dose)hdrs.push('Dosis');if(f.timing)hdrs.push('Einnahme');if(f.doctor)hdrs.push('Arzt');if(f.purpose)hdrs.push('Zweck');if(f.ingredients)hdrs.push('Inhaltsstoffe');if(f.notes)hdrs.push('Notizen');
  var rows=db.medicines.map(function(m){var r=[];if(f.name)r.push('"'+(m.name||'').replace(/"/g,'""')+'"');if(f.dose)r.push('"'+(m.dose||'').replace(/"/g,'""')+'"');if(f.timing)r.push('"'+(m.timing||'').replace(/"/g,'""')+'"');if(f.doctor)r.push('"'+(m.doctor||'').replace(/"/g,'""')+'"');if(f.purpose)r.push('"'+(m.purpose||'').replace(/"/g,'""')+'"');if(f.ingredients)r.push('"'+(m.ingredients||[]).join('; ').replace(/"/g,'""')+'"');if(f.notes)r.push('"'+(m.notes||'').replace(/"/g,'""')+'"');return r.join(',');});
  var csv='\uFEFF'+[hdrs.join(',')].concat(rows).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Medikamente_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  document.getElementById('exportModal').style.display='none';showToast('✅ CSV exportiert');
}
function doExportPDF(){
  var f={name:document.getElementById('exp-name').checked,dose:document.getElementById('exp-dose').checked,timing:document.getElementById('exp-timing').checked,doctor:document.getElementById('exp-doctor').checked,purpose:document.getElementById('exp-purpose').checked,ingredients:document.getElementById('exp-ingredients').checked,notes:document.getElementById('exp-notes').checked};
  var rows=db.medicines.map(function(m){var h='<div style="border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:12px;page-break-inside:avoid;">';if(f.name)h+='<h3 style="margin:0 0 7px;font-size:16px;">'+(m.name||'')+'</h3>';var meta=[];if(f.dose&&m.dose)meta.push('<strong>Dosis:</strong> '+m.dose);if(f.timing&&m.timing)meta.push('<strong>Einnahme:</strong> '+m.timing);if(f.doctor&&m.doctor)meta.push('<strong>Arzt:</strong> Dr. '+m.doctor);if(f.purpose&&m.purpose)meta.push('<strong>Zweck:</strong> '+m.purpose);if(meta.length)h+='<p style="font-size:13px;color:#444;margin:0 0 7px;">'+meta.join(' | ')+'</p>';if(f.ingredients&&m.ingredients&&m.ingredients.length)h+='<p style="font-size:13px;margin:0 0 5px;"><strong>Inhaltsstoffe:</strong> '+m.ingredients.join(', ')+'</p>';if(f.notes&&m.notes)h+='<p style="font-size:13px;color:#555;margin:0;"><strong>Notizen:</strong> '+m.notes+'</p>';h+='</div>';return h;}).join('');
  var win=window.open('','_blank');
  win.document.write('<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Medikamentenliste</title><style>body{font-family:-apple-system,sans-serif;max-width:680px;margin:30px auto;color:#222;}@media print{body{margin:10px;}}</style></head><body><h1 style="font-size:21px;">&#x1F48A; Medikamentenliste</h1><p style="color:#666;font-size:13px;margin-bottom:22px;">Erstellt am '+new Date().toLocaleDateString('de-DE')+' | '+db.medicines.length+' Medikamente</p>'+rows+'</body></html>');
  win.document.close();setTimeout(function(){win.print();},400);
  document.getElementById('exportModal').style.display='none';
}
